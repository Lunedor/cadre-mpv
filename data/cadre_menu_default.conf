# Built-in menu. Entries use: command #! stable.id | Menu > Item
script-message cadre-menu-open-file #! open.file | Open > Open File…
script-message cadre-menu-open-folder #! open.folder | Open > Open Folder…
script-message cadre-menu-open-url #! open.url | Open > Open URL…
separator #! open.separator | Open
script-message cadre-menu-locate-current-file #! open.locate | Open > Locate Current File

script-message toggle-playlist #! playlist.toggle | Playlist > Toggle Playlist
dynamic:playlist_actions #! playlist.actions | Playlist > Actions

dynamic:audio_tracks #! audio_tracks | Audio Tracks
dynamic:subtitle_tracks #! subtitle_tracks | Subtitle Tracks
dynamic:editions #! editions | Editions
dynamic:chapters #! chapters | Chapters

script-message cadre-settings-open #! cadre.settings | Cadre > Settings…
script-message cadre-osc-toggle #! cadre.osc | Cadre > Toggle OSC
script-message toggle-titlebar #! cadre.titlebar | Cadre > Toggle Title Bar

separator #! quit.separator | root
quit #! system.quit | Quit
