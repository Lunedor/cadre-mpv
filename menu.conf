# Optional context-menu customization. Defaults stay in data/cadre_menu_default.conf.
# Hide entries by stable ID, or append commands with:
#   script-message message-name #! Menu > Item
# An optional explicit ID is supported with: #! stable.id | Menu > Item
# Add a separator inside a submenu with: separator #! stable.id | Submenu
# Put the separator line where you want it; entries follow file order.
#
# Examples:
# hide playlist
# hide playlist.actions.repeat
# hide audio_tracks
# hide chapters.0
# hide_all clears built-in entries but keeps custom entries from this file
# script-message mpv-youtube-search-open #! Cadre Scripts > YouTube

# ============================================================
# Cadre context menu — full showcase
# Dynamic entries behave like normal items:
# unavailable dynamic sources show a dimmed placeholder.
# ============================================================

# ============================================================
# Cadre context menu — mpv-native actions + Cadre modules
# ============================================================

hide_all

# ============================================================
# Open
# ============================================================

script-message cadre-menu-open-file #! open.file | Open > Open File…
script-message cadre-menu-open-folder #! open.folder | Open > Open Folder…
script-message cadre-menu-open-url #! open.url | Open > Open URL…

separator #! open.separator_1 | Open
script-message reload-session #! open.cadre.session_reload | Open > Reload Session

# ============================================================
# Playback — native mpv
# ============================================================

cycle pause #! playback.play_pause | Playback > Play / Pause
script-message playlist-prev #! playlist.previous | Playback > Previous Item
script-message playlist-next #! playlist.next | Playback > Next Item
stop #! playback.stop | Playback > Stop
separator #! playback.separator_1 | Playback
dynamic:playback_speed #! playback.speed | Playback > Speed
dynamic:ab_loop #! playback.ab_loop | Playback > A-B Loop
separator #! playback.separator_2 | Playback
seek -10 #! playback.seekbar_back | Playback > Seek Back 10s
seek 10 #! playback.seekbar_forward | Playback > Seek Forward 10s

# ============================================================
# Video — native mpv
# ============================================================

cycle fullscreen #! video.fullscreen | Video > Toggle Fullscreen
screenshot #! video.screenshot | Video > Screenshot
separator #! video.separator_1 | Video

dynamic:editions #! editions | Video > Editions
dynamic:chapters #! chapters | Video > Chapters
separator #! track.separator_1 | Video

cycle-values video-rotate 90 180 270 0 #! video.rotate | Video > Rotate
cycle-values "!reverse" video-rotate 0 90 180 270 #! video.rotate_reverse | Video > Rotate Reverse
set video-rotate 0 #! video.rotate_reset | Video > Reset Rotation

separator #! video.separator_2 | Video
vf toggle hflip #! video.mirror_h | Video > Mirror Horizontally
vf toggle vflip #! video.mirror_v | Video > Mirror Vertically

separator #! video.separator_3 | Video
add video-zoom 0.1 #! video.zoom_in | Video > Zoom In
add video-zoom -0.1 #! video.zoom_out | Video > Zoom Out
set video-zoom 0 #! video.zoom_reset | Video > Reset Zoom

# ============================================================
# Audio — native mpv
# ============================================================

cycle mute #! audio.mute | Audio > Mute / Unmute
dynamic:audio_channels #! audio.channels | Audio > Channels
dynamic:audio_tracks #! audio_tracks | Audio > Audio Tracks

separator #! audio.separator | Audio
add audio-delay 0.1 #! audio.delay_up | Audio > Audio Delay +0.1s
add audio-delay -0.1 #! audio.delay_down | Audio > Audio Delay -0.1s
set audio-delay 0 #! audio.delay_reset | Audio > Reset Audio Delay

# ============================================================
# Subtitles — native mpv
# ============================================================

cycle sub-visibility #! subtitles.toggle | Subtitles > Toggle Subtitles
dynamic:subtitle_tracks #! subtitle_tracks | Subtitles > Subtitle Tracks
script-message cadre-subs-search #! open_subtitles_picker | Subtitles > Load Subtitles

separator #! subtitles.separator_1 | Subtitles
add sub-delay -0.1 #! subtitles.delay_up | Subtitles > Subtitle Delay -0.1s
add sub-delay 0.1 #! subtitles.delay_down | Subtitles > Subtitle Delay +0.1s
set sub-delay 0 #! subtitles.delay_reset | Subtitles > Reset Subtitle Delay

separator #! subtitles.separator_2 | Subtitles
add sub-scale 0.1 #! subtitles.size_up | Subtitles > Subtitle Size +10%
add sub-scale -0.1 #! subtitles.size_down | Subtitles > Subtitle Size -10%

separator #! subtitles.separator_3 | Subtitles
add sub-pos -1 #! subtitles.position_up | Subtitles > Subtitle Position Up
add sub-pos 1 #! subtitles.position_down | Subtitles > Subtitle Position Down

# ============================================================
# Cadre modules and interface
# ============================================================

script-message cadre-osc-pin-toggle #! cadre.osc | Cadre > Toggle OSC
script-message toggle-titlebar #! cadre.titlebar | Cadre > Toggle Title Bar
script-message toggle-playlist #! playlist.toggle | Cadre > Toggle Playlist

separator #! cadre.separator_1 | Cadre
script-message mpv-youtube-search-open #! cadre.youtube | Cadre > YouTube
script-message cadre-stream-open #! cadre.stream | Cadre > Stream
script-message webdav-browser-toggle #! open-browser | Cadre > WebDav

separator #! cadre.separator_2 | Cadre
script-message music-mode-toggle #! cadre.music_mode | Cadre > Music Mode

separator #! cadre.separator_3 | Cadre
script-message cadre-session-save #! cadre.session_save | Cadre > Save Session
script-message cadre-session-reload #! cadre.session_reload | Cadre > Reload Session

# ============================================================
# System
# ============================================================

separator #! settings.separator | root
script-message cadre-settings-open #! cadre.settings | Settings…
separator #! last.separator | root
quit #! system.quit | Quit from mpv
